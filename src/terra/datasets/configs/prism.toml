schema_version = 1

[dataset]
name = "prism"
description = "PRISM optical-MoCap SMPL labels with motion-only terrain reconstruction."

[input]
root = "runs/prism/smplh"
manifest = "runs/prism/smplh/manifest.csv"

[terrain]
mode = "fit"
calibration = "self"
contact_source = "kinematic"
contact_joints = ["L_Toe", "R_Toe", "L_Ankle", "R_Ankle"]
calibrate_sites = true

[terrain.fit]

[retarget]
method = "terra"
env_name = "MyoFullBody"
smpl_model_path = "smpl"
cache_root = "runs/prism/cache"
run_root = "runs/prism/retarget"

[retarget.overrides]
