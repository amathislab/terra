schema_version = 1

[dataset]
name = "amass-locomotion"
description = "Frozen 975-motion KINESIS/MuscleMimic AMASS locomotion cohort on flat ground."

[input]
root = "data/AMASS"
glob = "**/*.npz"

[terrain]
mode = "flat"
calibration = "none"
contact_source = "kinematic"
contact_joints = ["L_Toe", "R_Toe", "L_Ankle", "R_Ankle"]
calibrate_sites = true

[terrain.fit]

[retarget]
method = "terra"
env_name = "MyoFullBody"
smpl_model_path = "smpl"
cache_root = "runs/amass-locomotion/cache"
run_root = "runs/amass-locomotion/retarget"

[retarget.overrides]
